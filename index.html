<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>乒乓球专业计分器</title>
    <!-- 引入 Tailwind CSS 用于移动端精美布局 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 html2canvas 用于将记录导出为图片 -->
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
</head>
<body class="bg-gray-100 font-sans select-none pb-12">

    <div class="max-w-md mx-auto bg-white min-h-screen shadow-lg flex flex-col justify-between">
        
        <!-- 顶部控制与设置 -->
        <header class="bg-blue-600 text-white p-4 sticky top-0 z-10 shadow-md">
            <h1 class="text-center text-xl font-bold mb-2">🏓 乒乓球计分器 (三局两胜)</h1>
            
            <div class="flex gap-2 mb-3">
                <input id="player1Input" type="text" value="选手 A" placeholder="选手 A" class="w-1/2 p-1 text-black rounded text-center text-sm">
                <input id="player2Input" type="text" value="选手 B" placeholder="选手 B" class="w-1/2 p-1 text-black rounded text-center text-sm">
            </div>

            <div class="flex justify-between items-center text-sm">
                <!-- 记分模式切换 -->
                <div class="flex items-center gap-1">
                    <span class="text-xs">模式:</span>
                    <select id="modeSelect" class="bg-blue-700 text-white rounded p-1 text-xs" onchange="toggleMode()">
                        <option value="direct">0-15 数字面板</option>
                        <option value="plusminus">加减分 (+/-)</option>
                    </select>
                </div>
                <button onclick="resetCurrentMatch()" class="bg-red-500 hover:bg-red-600 px-3 py-1 rounded text-xs font-semibold">
                    重置本场
                </button>
            </div>
        </header>

        <!-- 主计分区域 -->
        <main class="p-4 flex-grow flex flex-col justify-between">
            
            <!-- 当前局数与状态提示 -->
            <div class="text-center my-2">
                <div id="gameNumberLabel" class="text-lg font-bold text-blue-600 bg-blue-50 py-1 rounded">
                    第 1 局 (进行中)
                </div>
                <div class="text-xs text-gray-500 mt-1">
                    规则: 11分制(赢2分) 或 先到15分者胜。每局打完交换场地。
                </div>
            </div>

            <!-- 大比分显示区 -->
            <div class="flex justify-between items-center bg-gray-50 p-4 rounded-xl border border-gray-200 shadow-inner my-3">
                <!-- 左侧 -->
                <div class="text-center w-5/12">
                    <div id="leftSideLabel" class="text-xs text-gray-500 font-semibold mb-1">左侧方位</div>
                    <div id="leftPlayerName" class="text-base font-bold text-gray-800 truncate">选手 A</div>
                    <div id="leftScore" class="text-6xl font-extrabold text-blue-600 my-2">0</div>
                    <div id="leftGamesWon" class="text-sm text-gray-500">胜局: 0</div>
                </div>

                <!-- VS / 分割线 -->
                <div class="text-center w-2/12">
                    <span class="text-xl font-bold text-gray-400">VS</span>
                </div>

                <!-- 右侧 -->
                <div class="text-center w-5/12">
                    <div id="rightSideLabel" class="text-xs text-gray-500 font-semibold mb-1">右侧方位</div>
                    <div id="rightPlayerName" class="text-base font-bold text-gray-800 truncate">选手 B</div>
                    <div id="rightScore" class="text-6xl font-extrabold text-blue-600 my-2">0</div>
                    <div id="rightGamesWon" class="text-sm text-gray-500">胜局: 0</div>
                </div>
            </div>

            <!-- 1. 0-15数字面板模式 (默认) -->
            <div id="directModeArea" class="grid grid-cols-2 gap-4 my-2">
                <!-- 左边 0-15 按钮 -->
                <div>
                    <div class="text-center text-xs text-gray-400 mb-1">点击左侧直接设分</div>
                    <div class="grid grid-cols-4 gap-1 bg-blue-50 p-2 rounded-lg">
                        <!-- JS动态生成0-15按钮 -->
                        <div id="leftButtons" class="contents"></div>
                    </div>
                </div>
                <!-- 右边 0-15 按钮 -->
                <div>
                    <div class="text-center text-xs text-gray-400 mb-1">点击右侧直接设分</div>
                    <div class="grid grid-cols-4 gap-1 bg-blue-50 p-2 rounded-lg">
                        <!-- JS动态生成0-15按钮 -->
                        <div id="rightButtons" class="contents"></div>
                    </div>
                </div>
            </div>

            <!-- 2. 加减分模式 (默认隐藏) -->
            <div id="plusminusModeArea" class="hidden grid grid-cols-2 gap-6 my-6">
                <!-- 左侧加减 -->
                <div class="flex flex-col gap-2">
                    <button onclick="changeScore('left', 1)" class="bg-blue-500 text-white text-3xl font-bold py-6 rounded-xl active:bg-blue-600 shadow">+</button>
                    <button onclick="changeScore('left', -1)" class="bg-gray-300 text-gray-700 text-xl font-bold py-2 rounded-xl active:bg-gray-400 shadow">-</button>
                </div>
                <!-- 右侧加减 -->
                <div class="flex flex-col gap-2">
                    <button onclick="changeScore('right', 1)" class="bg-blue-500 text-white text-3xl font-bold py-6 rounded-xl active:bg-blue-600 shadow">+</button>
                    <button onclick="changeScore('right', -1)" class="bg-gray-300 text-gray-700 text-xl font-bold py-2 rounded-xl active:bg-gray-400 shadow">-</button>
                </div>
            </div>

        </main>

        <!-- 历史记录区域 -->
        <section class="border-t border-gray-200 p-4 bg-gray-50">
            <div class="flex justify-between items-center mb-3">
                <h3 class="text-base font-bold text-gray-700">📋 历史比赛记录</h3>
                <button onclick="clearAllHistory()" class="text-xs text-red-500 border border-red-200 px-2 py-1 rounded bg-white">清空历史</button>
            </div>
            
            <!-- 记录容器，用于生成图片 -->
            <div id="historyContainer" class="space-y-3 max-h-80 overflow-y-auto pr-1">
                <!-- 记录卡片将由 JS 动态生成 -->
                <div id="noHistoryTip" class="text-center text-sm text-gray-400 py-4">暂无历史记录</div>
            </div>
        </section>

    </div>

    <!-- 核心逻辑 JS -->
    <script>
        // 比赛状态数据
        let match = {
            player1: "选手 A",
            player2: "选手 B",
            p1GamesWon: 0,
            p2GamesWon: 0,
            currentGameIndex: 1, // 当前第几局 (1, 2, 3)
            currentGameScores: { left: 0, right: 0 },
            gameLogs: [], // 记录每局的结果和时间
            matchFinished: false
        };

        // 历史比赛数据 (从本地存储读取)
        let matchHistory = JSON.parse(localStorage.getItem('pingpong_history')) || [];

        // 初始化加载
        window.onload = function() {
            renderDirectButtons();
            syncNames();
            updateUI();
            renderHistory();

            // 监听名字输入框变化
            document.getElementById('player1Input').addEventListener('input', (e) => {
                match.player1 = e.target.value || "选手 A";
                updateUI();
            });
            document.getElementById('player2Input').addEventListener('input', (e) => {
                match.player2 = e.target.value || "选手 B";
                updateUI();
            });
        };

        // 同步输入框的名字
        function syncNames() {
            match.player1 = document.getElementById('player1Input').value || "选手 A";
            match.player2 = document.getElementById('player2Input').value || "选手 B";
        }

        // 获取当前局中，“左侧”和“右侧”分别对应哪位选手
        // 第一局：左 A vs 右 B
        // 第二局：左 B vs 右 A （交换场地）
        // 第三局：左 A vs 右 B （再次交换场地）
        function getSides() {
            if (match.currentGameIndex === 2) {
                return {
                    leftPlayer: match.player2,
                    rightPlayer: match.player1,
                    leftKey: 'p2',
                    rightKey: 'p1'
                };
            } else {
                return {
                    leftPlayer: match.player1,
                    rightPlayer: match.player2,
                    leftKey: 'p1',
                    rightKey: 'p2'
                };
            }
        }

        // 切换记分模式
        function toggleMode() {
            const mode = document.getElementById('modeSelect').value;
            if (mode === 'direct') {
                document.getElementById('directModeArea').classList.remove('hidden');
                document.getElementById('plusminusModeArea').classList.add('hidden');
            } else {
                document.getElementById('directModeArea').classList.add('hidden');
                document.getElementById('plusminusModeArea').classList.remove('hidden');
            }
        }

        // 生成0-15数字面板按钮
        function renderDirectButtons() {
            const leftContainer = document.getElementById('leftButtons');
            const rightContainer = document.getElementById('rightButtons');
            leftContainer.innerHTML = '';
            rightContainer.innerHTML = '';

            for (let i = 0; i <= 15; i++) {
                leftContainer.innerHTML += `<button onclick="setScoreDirect('left', ${i})" class="bg-white border border-gray-300 rounded text-sm py-1.5 active:bg-blue-500 active:text-white transition-colors duration-100">${i}</button>`;
                rightContainer.innerHTML += `<button onclick="setScoreDirect('right', ${i})" class="bg-white border border-gray-300 rounded text-sm py-1.5 active:bg-blue-500 active:text-white transition-colors duration-100">${i}</button>`;
            }
        }

        // 模式1：直接点击设置分数
        function setScoreDirect(side, value) {
            if (match.matchFinished) return;
            match.currentGameScores[side] = value;
            updateUI();
            checkGameWinCondition();
        }

        // 模式2：加减分数
        function changeScore(side, amount) {
            if (match.matchFinished) return;
            let current = match.currentGameScores[side];
            let target = current + amount;
            if (target >= 0 && target <= 15) {
                match.currentGameScores[side] = target;
                updateUI();
                checkGameWinCondition();
            }
        }

        // 核心：检查是否有人赢得本局
        function checkGameWinCondition() {
            const leftScore = match.currentGameScores.left;
            const rightScore = match.currentGameScores.right;
            const sides = getSides();

            // 胜局判断逻辑
            function isWinner(score, opponentScore) {
                // 1. 达到15分直接赢
                if (score === 15) return true;
                // 2. 达到11分及以上，且领先对手2分及以上
                if (score >= 11 && (score - opponentScore) >= 2) return true;
                return false;
            }

            let leftWins = isWinner(leftScore, rightScore);
            let rightWins = isWinner(rightScore, leftScore);

            if (leftWins || rightWins) {
                let winnerKey = leftWins ? sides.leftKey : sides.rightKey;
                let winnerName = leftWins ? sides.leftPlayer : sides.rightPlayer;
                
                // 记录本局结果
                const timestamp = new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
                match.gameLogs.push({
                    gameIndex: match.currentGameIndex,
                    time: timestamp,
                    scoreDisplay: `${sides.leftPlayer} ${leftScore} : ${rightScore} ${sides.rightPlayer}`,
                    winner: winnerName
                });

                // 更新胜局数
                if (winnerKey === 'p1') {
                    match.p1GamesWon++;
                } else {
                    match.p2GamesWon++;
                }

                // 判断整场比赛是否结束（三局两胜）
                if (match.p1GamesWon === 2 || match.p2GamesWon === 2) {
                    match.matchFinished = true;
                    saveMatchToHistory();
                    alert(`🎉 比赛结束！恭喜 ${winnerName} 获得最终胜利！`);
                } else {
                    // 进入下一局并交换场地
                    alert(`第 ${match.currentGameIndex} 局结束，${winnerName} 获胜！请交换场地，准备开始下一局。`);
                    match.currentGameIndex++;
                    match.currentGameScores = { left: 0, right: 0 };
                }
                updateUI();
            }
        }

        // 更新界面渲染
        function updateUI() {
            const sides = getSides();
            
            // 更新当前局数提示
            const label = document.getElementById('gameNumberLabel');
            if (match.matchFinished) {
                label.innerText = "比赛已结束";
                label.className = "text-lg font-bold text-red-600 bg-red-50 py-1 rounded";
            } else {
                label.innerText = `第 ${match.currentGameIndex} 局 (进行中)`;
                label.className = "text-lg font-bold text-blue-600 bg-blue-50 py-1 rounded";
            }

            // 更新左侧和右侧的姓名、当前比分、胜局数
            document.getElementById('leftPlayerName').innerText = sides.leftPlayer;
            document.getElementById('leftScore').innerText = match.currentGameScores.left;
            document.getElementById('leftGamesWon').innerText = `胜局: ${sides.leftKey === 'p1' ? match.p1GamesWon : match.p2GamesWon}`;

            document.getElementById('rightPlayerName').innerText = sides.rightPlayer;
            document.getElementById('rightScore').innerText = match.currentGameScores.right;
            document.getElementById('rightGamesWon').innerText = `胜局: ${sides.rightKey === 'p1' ? match.p1GamesWon : match.p2GamesWon}`;

            // 标注场地（让裁判看明白是谁在左边谁在右边）
            document.getElementById('leftSideLabel').innerText = `左侧 [当前: ${sides.leftPlayer === match.player1 ? '1号位' : '2号位'}]`;
            document.getElementById('rightSideLabel').innerText = `右侧 [当前: ${sides.rightPlayer === match.player1 ? '1号位' : '2号位'}]`;
        }

        // 重置当前整场比赛
        function resetCurrentMatch() {
            if (confirm("确定要重置当前比赛吗？当前比分和尚未完成的记录将丢失。")) {
                match = {
                    player1: document.getElementById('player1Input').value || "选手 A",
                    player2: document.getElementById('player2Input').value || "选手 B",
                    p1GamesWon: 0,
                    p2GamesWon: 0,
                    currentGameIndex: 1,
                    currentGameScores: { left: 0, right: 0 },
                    gameLogs: [],
                    matchFinished: false
                };
                updateUI();
            }
        }

        // 保存比赛记录至本地
        function saveMatchToHistory() {
            const dateStr = new Date().toLocaleDateString('zh-CN', { month: '2-digit', day: '2-digit' });
            const timeStr = new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
            
            const winner = match.p1GamesWon === 2 ? match.player1 : match.player2;

            const record = {
                id: 'match_' + Date.now(),
                date: `${dateStr} ${timeStr}`,
                player1: match.player1,
                player2: match.player2,
                winner: winner,
                gamesWon: `${match.p1GamesWon} : ${match.p2GamesWon}`,
                logs: [...match.gameLogs]
            };

            matchHistory.unshift(record); // 最新记录放最前面
            localStorage.setItem('pingpong_history', JSON.stringify(matchHistory));
            renderHistory();
        }

        // 渲染历史记录列表
        function renderHistory() {
            const container = document.getElementById('historyContainer');
            if (matchHistory.length === 0) {
                container.innerHTML = `<div id="noHistoryTip" class="text-center text-sm text-gray-400 py-4">暂无历史记录</div>`;
                return;
            }

            container.innerHTML = '';
            matchHistory.forEach((item, index) => {
                let logsHtml = '';
                item.logs.forEach(log => {
                    logsHtml += `
                        <div class="flex justify-between text-xs text-gray-500 border-b border-dashed border-gray-100 py-1">
                            <span>第 ${log.gameIndex} 局 [时间 ${log.time}]</span>
                            <span class="font-medium">${log.scoreDisplay}</span>
                        </div>
                    `;
                });

                container.innerHTML += `
                    <div id="card-${item.id}" class="bg-white p-3 rounded-lg border border-gray-200 shadow-sm relative">
                        <div class="flex justify-between items-center mb-1 pb-1 border-b border-gray-100">
                            <span class="text-xs font-bold text-blue-600">${item.date}</span>
                            <span class="text-xs text-emerald-600 font-semibold bg-emerald-50 px-1.5 py-0.5 rounded">赢家: ${item.winner}</span>
                        </div>
                        <div class="text-sm font-bold text-gray-800 my-1 flex justify-between">
                            <span>${item.player1} VS ${item.player2}</span>
                            <span class="text-blue-600">比分: ${item.gamesWon}</span>
                        </div>
                        <div class="mt-2 space-y-1">
                            ${logsHtml}
                        </div>
                        <!-- 卡片操作按键 -->
                        <div class="mt-3 flex justify-end gap-2 text-xs">
                            <button onclick="downloadCardImage('${item.id}')" class="bg-blue-50 text-blue-600 border border-blue-200 px-2.5 py-1 rounded-md font-medium active:bg-blue-100">
                                💾 保存图片
                            </button>
                            <button onclick="deleteRecord('${item.id}')" class="bg-red-50 text-red-500 border border-red-100 px-2.5 py-1 rounded-md font-medium active:bg-red-100">
                                删除
                            </button>
                        </div>
                    </div>
                `;
            });
        }

        // 删除单条记录
        function deleteRecord(id) {
            if (confirm("确定要删除这条记录吗？")) {
                matchHistory = matchHistory.filter(item => item.id !== id);
                localStorage.setItem('pingpong_history', JSON.stringify(matchHistory));
                renderHistory();
            }
        }

        // 清空所有历史
        function clearAllHistory() {
            if (confirm("确定清空所有历史比赛记录吗？数据清空后将无法找回。")) {
                matchHistory = [];
                localStorage.removeItem('pingpong_history');
                renderHistory();
            }
        }

        // 保存记录卡片为手机图片
        function downloadCardImage(cardId) {
            const card = document.getElementById(`card-${cardId}`);
            
            // 临时隐藏卡片底部的操作按钮以保持图片整洁
            const buttons = card.querySelector('div:last-child');
            buttons.style.display = 'none';

            // 设置 html2canvas 渲染参数
            const options = {
                backgroundColor: '#f3f4f6', // 设置与背景一致的灰色底
                scale: 2, // 提高清晰度
                useCORS: true
            };

            html2canvas(card, options).then(canvas => {
                // 恢复按钮显示
                buttons.style.display = 'flex';

                // 将 canvas 转换为 base64 图片格式
                const imgData = canvas.toDataURL('image/png');

                // 创建下载链接
                const link = document.createElement('a');
                link.download = `乒乓球比赛记录-${cardId.substring(6)}.png`;
                link.href = imgData;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            }).catch(err => {
                buttons.style.display = 'flex';
                alert('保存图片失败，请重试');
                console.error(err);
            });
        }
    </script>
</body>
</html>
